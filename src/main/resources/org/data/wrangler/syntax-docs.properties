# Documentation for DuckDB-specific syntax shown in completion popups and hover tooltips.
# Keys: <KEYWORD>.summary, .syntax, .example, .url  (url is relative to https://duckdb.org/docs/stable/)
# Multi-word keywords use underscores: GROUP_BY_ALL.

QUALIFY.summary=Filters the result of window functions, like HAVING does for aggregates. Avoids wrapping the query in a subquery.
QUALIFY.syntax=SELECT ... FROM ... [WHERE ...] QUALIFY <condition on window function>
QUALIFY.example=SELECT *, row_number() OVER (PARTITION BY city ORDER BY total DESC) AS rn\nFROM sales\nQUALIFY rn <= 3;
QUALIFY.url=sql/query_syntax/qualify

EXCLUDE.summary=Star expression modifier: select all columns except the listed ones.
EXCLUDE.syntax=SELECT * EXCLUDE (col1, col2) FROM ...
EXCLUDE.example=SELECT * EXCLUDE (password, ssn) FROM users;
EXCLUDE.url=sql/expressions/star

REPLACE.summary=Star expression modifier: select all columns but replace some with an expression under the same name.
REPLACE.syntax=SELECT * REPLACE (<expr> AS col, ...) FROM ...
REPLACE.example=SELECT * REPLACE (round(price, 2) AS price) FROM products;
REPLACE.url=sql/expressions/star

COLUMNS.summary=Apply an expression to every column matching a regex or lambda, e.g. min(COLUMNS('*')).
COLUMNS.syntax=COLUMNS('<regex>')  |  COLUMNS(c -> <lambda>)  |  COLUMNS(*)
COLUMNS.example=SELECT min(COLUMNS('.*_ms')), max(COLUMNS(*)) FROM timings;
COLUMNS.url=sql/expressions/star

PIVOT.summary=Reshape rows into columns. Distinct values of the ON column become new columns; no need to enumerate them.
PIVOT.syntax=PIVOT <table> ON <column(s)> USING <aggregate(s)> [GROUP BY <cols>]
PIVOT.example=PIVOT cities ON year USING sum(population) GROUP BY country;
PIVOT.url=sql/statements/pivot

UNPIVOT.summary=Reshape columns into rows (inverse of PIVOT).
UNPIVOT.syntax=UNPIVOT <table> ON <columns> INTO NAME <name_col> VALUE <value_col>
UNPIVOT.example=UNPIVOT monthly ON jan, feb, mar INTO NAME month VALUE revenue;
UNPIVOT.url=sql/statements/unpivot

ASOF.summary=As-of join: match each left row to the nearest preceding (or following) right row by an inequality on a time/ordering column. Ideal for time series.
ASOF.syntax=<left> ASOF [LEFT] JOIN <right> ON <left.key = right.key AND> left.ts >= right.ts
ASOF.example=SELECT t.symbol, t.ts, p.price\nFROM trades t ASOF JOIN prices p ON t.symbol = p.symbol AND t.ts >= p.ts;
ASOF.url=sql/query_syntax/from

SEMI.summary=Semi join: rows from the left table that have at least one match on the right; right columns are not returned.
SEMI.syntax=<left> SEMI JOIN <right> ON <condition>
SEMI.example=SELECT * FROM customers c SEMI JOIN orders o ON c.id = o.customer_id;
SEMI.url=sql/query_syntax/from

ANTI.summary=Anti join: rows from the left table with no match on the right.
ANTI.syntax=<left> ANTI JOIN <right> ON <condition>
ANTI.example=SELECT * FROM customers c ANTI JOIN orders o ON c.id = o.customer_id;
ANTI.url=sql/query_syntax/from

POSITIONAL.summary=Positional join: pair rows by position (1st with 1st, 2nd with 2nd, ...). Useful for files with the same row order.
POSITIONAL.syntax=<left> POSITIONAL JOIN <right>
POSITIONAL.example=SELECT * FROM read_csv('a.csv') POSITIONAL JOIN read_csv('b.csv');
POSITIONAL.url=sql/query_syntax/from

LATERAL.summary=Lateral join: the right side can reference columns of the left side (correlated subquery in FROM).
LATERAL.syntax=<left>, LATERAL (SELECT ... WHERE ... = <left>.col) AS x
LATERAL.example=SELECT * FROM t, LATERAL (SELECT t.a + 1 AS b) x;
LATERAL.url=sql/query_syntax/from

SAMPLE.summary=Return a random sample of rows: a fixed count, a percentage, or with a specific method (reservoir, bernoulli, system).
SAMPLE.syntax=... USING SAMPLE <n> [ROWS]  |  USING SAMPLE <p>% [(method[, seed])]
SAMPLE.example=SELECT * FROM events USING SAMPLE 10% (bernoulli, 42);
SAMPLE.url=sql/samples

INSTALL.summary=Download an extension into the local extension directory. Run once; use LOAD to activate it in a session.
INSTALL.syntax=INSTALL <extension> [FROM <repository>]
INSTALL.example=INSTALL spatial;\nLOAD spatial;
INSTALL.url=extensions/overview

LOAD.summary=Load an installed extension into the current session, making its functions and types available.
LOAD.syntax=LOAD <extension>
LOAD.example=LOAD httpfs;
LOAD.url=extensions/overview

ATTACH.summary=Attach another database file (DuckDB, SQLite, PostgreSQL, MySQL via extensions) as a catalog you can query alongside the current one.
ATTACH.syntax=ATTACH '<path or connection string>' [AS <name>] [(TYPE <type>, READ_ONLY)]
ATTACH.example=ATTACH 'old.duckdb' AS old (READ_ONLY);\nSELECT * FROM old.main.orders;
ATTACH.url=sql/statements/attach

DETACH.summary=Detach a previously attached database.
DETACH.syntax=DETACH <name>
DETACH.example=DETACH old;
DETACH.url=sql/statements/attach

USE.summary=Set the default catalog/schema for unqualified names.
USE.syntax=USE <catalog>[.<schema>]
USE.example=USE old.main;
USE.url=sql/statements/use

MACRO.summary=Create a reusable SQL macro: a scalar expression or a table-valued query with parameters.
MACRO.syntax=CREATE [OR REPLACE] MACRO <name>(<params>) AS <expr>  |  AS TABLE <query>
MACRO.example=CREATE MACRO add_tax(p, rate := 0.21) AS p * (1 + rate);\nCREATE MACRO top(n) AS TABLE SELECT * FROM sales ORDER BY total DESC LIMIT n;
MACRO.url=sql/statements/create_macro

COPY.summary=Import a file into a table or export a query/table to a file (CSV, Parquet, JSON).
COPY.syntax=COPY <table> FROM '<file>' (options)  |  COPY (<query>) TO '<file>' (FORMAT parquet)
COPY.example=COPY (SELECT * FROM sales WHERE year = 2025) TO 'sales_2025.parquet' (FORMAT parquet);
COPY.url=sql/statements/copy

EXPORT_DATABASE.summary=Write the whole database (schema + data) to a directory.
EXPORT_DATABASE.syntax=EXPORT DATABASE '<dir>' [(FORMAT parquet)]
EXPORT_DATABASE.example=EXPORT DATABASE 'backup' (FORMAT parquet);
EXPORT_DATABASE.url=sql/statements/export

IMPORT_DATABASE.summary=Recreate a database from an EXPORT DATABASE directory.
IMPORT_DATABASE.syntax=IMPORT DATABASE '<dir>'
IMPORT_DATABASE.example=IMPORT DATABASE 'backup';
IMPORT_DATABASE.url=sql/statements/export

DESCRIBE.summary=Show the columns and types of a table or of any query's result.
DESCRIBE.syntax=DESCRIBE <table>  |  DESCRIBE <query>
DESCRIBE.example=DESCRIBE SELECT * FROM read_parquet('data.parquet');
DESCRIBE.url=guides/meta/describe

SUMMARIZE.summary=Column statistics for a table or query: min, max, approx unique, avg, std, quartiles, null percentage.
SUMMARIZE.syntax=SUMMARIZE <table>  |  SUMMARIZE <query>
SUMMARIZE.example=SUMMARIZE read_csv('events.csv');
SUMMARIZE.url=guides/meta/summarize

PRAGMA.summary=Query or change database-level settings and inspect internals.
PRAGMA.syntax=PRAGMA <name>  |  PRAGMA <name> = <value>
PRAGMA.example=PRAGMA database_size;\nPRAGMA enable_profiling;
PRAGMA.url=configuration/pragmas

SET.summary=Change a configuration option for the session (or globally).
SET.syntax=SET [SESSION|GLOBAL] <option> = <value>
SET.example=SET memory_limit = '4GB';\nSET threads = 4;
SET.url=sql/statements/set

RESET.summary=Restore a configuration option to its default.
RESET.syntax=RESET <option>
RESET.example=RESET memory_limit;
RESET.url=sql/statements/set

CHECKPOINT.summary=Flush the write-ahead log into the database file.
CHECKPOINT.syntax=CHECKPOINT [<database>]  |  FORCE CHECKPOINT
CHECKPOINT.example=CHECKPOINT;
CHECKPOINT.url=sql/statements/checkpoint

RETURNING.summary=Return rows affected by INSERT / UPDATE / DELETE.
RETURNING.syntax=INSERT INTO ... RETURNING <columns>
RETURNING.example=INSERT INTO t (v) VALUES (1) RETURNING id;
RETURNING.url=sql/statements/insert

GROUP_BY_ALL.summary=Group by every non-aggregated column in the SELECT list, without repeating them.
GROUP_BY_ALL.syntax=SELECT ... GROUP BY ALL
GROUP_BY_ALL.example=SELECT city, year, sum(total) FROM sales GROUP BY ALL;
GROUP_BY_ALL.url=sql/query_syntax/groupby

ORDER_BY_ALL.summary=Order by all columns left to right.
ORDER_BY_ALL.syntax=SELECT ... ORDER BY ALL [DESC]
ORDER_BY_ALL.example=SELECT * FROM t ORDER BY ALL;
ORDER_BY_ALL.url=sql/query_syntax/orderby

UNION_BY_NAME.summary=Combine result sets by column name instead of position; missing columns become NULL.
UNION_BY_NAME.syntax=<query> UNION [ALL] BY NAME <query>
UNION_BY_NAME.example=SELECT * FROM read_csv('2024.csv') UNION ALL BY NAME SELECT * FROM read_csv('2025.csv');
UNION_BY_NAME.url=sql/query_syntax/setops

TRY_CAST.summary=Cast that returns NULL instead of raising an error when the conversion fails.
TRY_CAST.syntax=TRY_CAST(<expr> AS <type>)
TRY_CAST.example=SELECT TRY_CAST('abc' AS INTEGER);  -- NULL
TRY_CAST.url=sql/expressions/cast

LAMBDA.summary=Anonymous function used by list functions: x -> expr, or (x, i) -> expr with index.
LAMBDA.syntax=<param> -> <expr>  |  (<a>, <b>) -> <expr>
LAMBDA.example=SELECT list_transform([1, 2, 3], x -> x * 2);\nSELECT list_filter([1, 2, 3], x -> x > 1);
LAMBDA.url=sql/functions/lambda

STRUCT.summary=Composite type with named fields. Literal syntax uses braces; access fields with dot notation.
STRUCT.syntax=STRUCT(<name> <type>, ...)  |  {'a': 1, 'b': 'x'}  |  s.a
STRUCT.example=SELECT {'city': 'Utrecht', 'zip': 3511} AS addr, addr.city;
STRUCT.url=sql/data_types/struct

LIST.summary=Variable-length array of a single type. Literal syntax uses brackets; 1-based indexing and slicing.
LIST.syntax=<type>[]  |  [1, 2, 3]  |  l[1]  |  l[2:3]
LIST.example=SELECT [1, 2, 3] AS l, l[1], l[2:3], len(l);
LIST.url=sql/data_types/list

MAP.summary=Key/value collection; keys are unique and all values share a type.
MAP.syntax=MAP {<key>: <value>, ...}  |  map(<keys>, <values>)  |  m['key']
MAP.example=SELECT MAP {'a': 1, 'b': 2} AS m, m['a'];
MAP.url=sql/data_types/map

UNION.summary=As a type: a tagged union that holds one of several member types. (As a set operation it is standard SQL.)
UNION.syntax=UNION(<tag> <type>, ...)  |  union_value(<tag> := <value>)
UNION.example=SELECT union_value(num := 2) AS u, union_tag(u);
UNION.url=sql/data_types/union

HUGEINT.summary=128-bit signed integer (-2^127 .. 2^127-1). UHUGEINT is the unsigned variant.
HUGEINT.syntax=HUGEINT  |  UHUGEINT
HUGEINT.example=SELECT 170141183460469231731687303715884105727::HUGEINT;
HUGEINT.url=sql/data_types/numeric

UINTEGER.summary=32-bit unsigned integer. Family: UTINYINT, USMALLINT, UINTEGER, UBIGINT, UHUGEINT.
UINTEGER.syntax=UTINYINT | USMALLINT | UINTEGER | UBIGINT | UHUGEINT
UINTEGER.example=SELECT 4294967295::UINTEGER;
UINTEGER.url=sql/data_types/numeric

TIMESTAMPTZ.summary=Timestamp with time zone (TIMESTAMP WITH TIME ZONE). Stored in UTC, displayed in the session TimeZone setting.
TIMESTAMPTZ.syntax=TIMESTAMPTZ  |  TIMESTAMP WITH TIME ZONE
TIMESTAMPTZ.example=SET TimeZone = 'Europe/Amsterdam';\nSELECT now()::TIMESTAMPTZ;
TIMESTAMPTZ.url=sql/data_types/timestamp

JSON.summary=JSON type from the json extension. Use -> / ->> to extract, or json_extract().
JSON.syntax=JSON  |  j -> '$.path'  |  j ->> '$.path'  |  json_extract(j, '$.path')
JSON.example=SELECT '{"a": {"b": 1}}'::JSON -> '$.a.b';
JSON.url=data/json/overview

CREATE_SECRET.summary=Store credentials (S3, GCS, Azure, HTTP, ...) for use by extensions like httpfs.
CREATE_SECRET.syntax=CREATE [PERSISTENT] SECRET [<name>] (TYPE <type>, <key> <value>, ...)
CREATE_SECRET.example=CREATE SECRET (TYPE s3, KEY_ID 'AKIA...', SECRET '...', REGION 'eu-west-1');
CREATE_SECRET.url=configuration/secrets_manager

# --- Standard SQL keywords, documented for what DuckDB adds to them ---
SELECT.summary=Projection. DuckDB additions: * EXCLUDE / REPLACE, COLUMNS(), a bare "SELECT" is optional when the query starts with FROM, and the SELECT list may reference aliases defined earlier in it.
SELECT.syntax=SELECT [DISTINCT [ON (...)]] <exprs> [FROM ...] [WHERE ...] [GROUP BY ...] [HAVING ...] [QUALIFY ...] [ORDER BY ...] [LIMIT ...]
SELECT.example=SELECT city, sum(total) AS t, t * 1.21 AS with_vat FROM sales GROUP BY ALL;
SELECT.url=sql/statements/select

FROM.summary=Data source. In DuckDB it can be a table, view, CTE, file path ('data.parquet', 'a/*.csv'), table function (read_csv, range, ...) or subquery, and a query may start with FROM (SELECT * is implied).
FROM.syntax=FROM <table | 'file' | func(...) | (subquery)> [AS alias] [, ...] [JOIN ...]
FROM.example=FROM 'sales/*.parquet' SELECT city, count(*) GROUP BY ALL;\nFROM sales;  -- same as SELECT * FROM sales
FROM.url=sql/query_syntax/from

WHERE.summary=Row filter. DuckDB allows referencing SELECT-list aliases here and supports BETWEEN, IN, LIKE / ILIKE / SIMILAR TO, ~ (regex), and lambda-based list predicates.
WHERE.syntax=WHERE <condition>
WHERE.example=SELECT total * 2 AS dbl FROM sales WHERE dbl > 10 AND city ILIKE 'u%';
WHERE.url=sql/query_syntax/where

JOIN.summary=Join tables. DuckDB adds ASOF, SEMI, ANTI and POSITIONAL joins, and NATURAL / USING shorthands.
JOIN.syntax=<left> [INNER|LEFT|RIGHT|FULL|CROSS|ASOF|SEMI|ANTI|POSITIONAL] JOIN <right> [ON cond | USING (cols)]
JOIN.example=SELECT * FROM orders o LEFT JOIN customers c USING (customer_id);
JOIN.url=sql/query_syntax/from

GROUP.summary=Aggregate rows. DuckDB's GROUP BY ALL groups by every non-aggregated SELECT column; GROUPING SETS, CUBE and ROLLUP are supported.
GROUP.syntax=GROUP BY <exprs> | ALL | GROUPING SETS (...) | CUBE (...) | ROLLUP (...)
GROUP.example=SELECT city, year, sum(total) FROM sales GROUP BY ALL;
GROUP.url=sql/query_syntax/groupby

HAVING.summary=Filter groups after aggregation. For filtering window function results use QUALIFY instead.
HAVING.syntax=HAVING <condition on aggregates>
HAVING.example=SELECT city, count(*) FROM sales GROUP BY city HAVING count(*) > 10;
HAVING.url=sql/query_syntax/having

ORDER.summary=Sort rows. DuckDB adds ORDER BY ALL, NULLS FIRST/LAST, and collation (COLLATE NOCASE, ...).
ORDER.syntax=ORDER BY <expr> [ASC|DESC] [NULLS FIRST|LAST] [, ...] | ORDER BY ALL
ORDER.example=SELECT * FROM sales ORDER BY total DESC NULLS LAST, city COLLATE NOCASE;
ORDER.url=sql/query_syntax/orderby

LIMIT.summary=Cap the number of rows; OFFSET skips rows. Percent limits (LIMIT 10%) and USING SAMPLE are DuckDB extras.
LIMIT.syntax=LIMIT <n | p%> [OFFSET <m>]
LIMIT.example=SELECT * FROM sales ORDER BY total DESC LIMIT 10 OFFSET 20;
LIMIT.url=sql/query_syntax/limit

WITH.summary=Common table expressions. DuckDB supports RECURSIVE and MATERIALIZED / NOT MATERIALIZED hints.
WITH.syntax=WITH [RECURSIVE] <name> [(cols)] AS [MATERIALIZED] (<query>) [, ...] <statement>
WITH.example=WITH big AS MATERIALIZED (SELECT * FROM sales WHERE total > 100) SELECT city, count(*) FROM big GROUP BY ALL;
WITH.url=sql/query_syntax/with

CREATE.summary=Create objects. Beyond tables/views/indexes, DuckDB has CREATE MACRO, CREATE SECRET, CREATE TYPE (enums), CREATE SEQUENCE and CREATE OR REPLACE for most of them; CREATE TABLE ... AS SELECT is common.
CREATE.syntax=CREATE [OR REPLACE] [TEMP] TABLE|VIEW|MACRO|SECRET|TYPE|SEQUENCE|INDEX|SCHEMA ...
CREATE.example=CREATE OR REPLACE TABLE sales AS SELECT * FROM read_csv('sales.csv');
CREATE.url=sql/statements/overview

INSERT.summary=Insert rows. DuckDB supports INSERT ... BY NAME, ON CONFLICT DO NOTHING / DO UPDATE (upsert), and RETURNING.
INSERT.syntax=INSERT [OR REPLACE|OR IGNORE] INTO <table> [BY NAME] <VALUES ... | query> [ON CONFLICT ...] [RETURNING ...]
INSERT.example=INSERT INTO sales BY NAME SELECT id, total FROM staging ON CONFLICT DO NOTHING;
INSERT.url=sql/statements/insert

UPDATE.summary=Modify rows. Supports FROM (join-based updates) and RETURNING.
UPDATE.syntax=UPDATE <table> SET col = expr [, ...] [FROM <source>] [WHERE cond] [RETURNING ...]
UPDATE.example=UPDATE sales SET total = total * 1.1 FROM regions r WHERE sales.city = r.city AND r.boost;
UPDATE.url=sql/statements/update

DELETE.summary=Remove rows. Supports USING (join-based deletes) and RETURNING.
DELETE.syntax=DELETE FROM <table> [USING <source>] [WHERE cond] [RETURNING ...]
DELETE.example=DELETE FROM sales WHERE total IS NULL RETURNING id;
DELETE.url=sql/statements/delete

CAST.summary=Type conversion; ::type shorthand is equivalent. TRY_CAST returns NULL instead of failing.
CAST.syntax=CAST(<expr> AS <type>)  |  <expr>::<type>
CAST.example=SELECT '42'::INTEGER, CAST(3.7 AS INTEGER);
CAST.url=sql/expressions/cast

CASE.summary=Conditional expression. DuckDB also offers if(cond, a, b) and coalesce / ifnull / nullif shortcuts.
CASE.syntax=CASE WHEN cond THEN v [WHEN ...] [ELSE v] END  |  CASE <expr> WHEN x THEN v ... END
CASE.example=SELECT CASE WHEN total > 100 THEN 'big' ELSE 'small' END FROM sales;
CASE.url=sql/expressions/case

DISTINCT.summary=Remove duplicate rows. DuckDB adds DISTINCT ON (exprs) to keep one row per key, ordered by the ORDER BY clause.
DISTINCT.syntax=SELECT DISTINCT [ON (<exprs>)] ...
DISTINCT.example=SELECT DISTINCT ON (city) city, total FROM sales ORDER BY city, total DESC;
DISTINCT.url=sql/statements/select

OVER.summary=Window function clause. DuckDB supports named windows (WINDOW w AS (...)), RANGE/ROWS/GROUPS frames and EXCLUDE.
OVER.syntax=<func>(...) OVER ([PARTITION BY ...] [ORDER BY ...] [frame])
OVER.example=SELECT city, total, rank() OVER (PARTITION BY city ORDER BY total DESC) FROM sales;
OVER.url=sql/functions/window_functions

VALUES.summary=Inline rows. Can be used standalone, in FROM with a column-list alias, or in INSERT.
VALUES.syntax=VALUES (v, ...), (v, ...)  |  FROM (VALUES ...) AS t(col1, col2)
VALUES.example=SELECT * FROM (VALUES (1, 'a'), (2, 'b')) AS t(id, name);
VALUES.url=sql/query_syntax/values

TABLE.summary=Shorthand for SELECT * FROM a table.
TABLE.syntax=TABLE <name>
TABLE.example=TABLE sales;
TABLE.url=sql/statements/select

EXPLAIN.summary=Show the query plan without running it; EXPLAIN ANALYZE runs it and shows actual timings per operator.
EXPLAIN.syntax=EXPLAIN [ANALYZE] <statement>
EXPLAIN.example=EXPLAIN ANALYZE SELECT city, sum(total) FROM sales GROUP BY ALL;
EXPLAIN.url=guides/meta/explain
