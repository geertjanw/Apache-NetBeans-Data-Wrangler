OpenIDE-Module-Name=NetBeans DataWrangler
OpenIDE-Module-Display-Category=Database
OpenIDE-Module-Short-Description=Query, convert, inspect, edit and analyze CSV, Apache Parquet, JSON and Excel files in the IDE, with analytical SQL powered by DuckDB.
OpenIDE-Module-Long-Description=NetBeans DataWrangler brings the file formats of data analytics into the IDE: CSV, Apache Parquet \
  (https://parquet.apache.org/), JSON and Excel, the formats exchanged with pandas, Spark, R, dbt and Power BI. Query, convert, inspect, edit \
  and analyze them without leaving NetBeans. Open them as documents with Visual and Query tabs; \
  query them with SQL, join them, aggregate them, pivot them; convert between formats; load them into tables \
  and export the results. The SQL editor gains completion, documentation, error checking and quick fixes for \
  analytical SQL. DuckDB is bundled: no server, no setup, no credentials.
Templates/Analytics=Analytics
